services:
  htpcmanager:
    image: linuxserver/htpcmanager:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
    ports:
      - '8085:8085/tcp'
    volumes:
      - '/srv/lsio/htpcmanager/config:/config'
    restart: 'unless-stopped'
    platform: 'linux'
