services:
  limnoria:
    image: linuxserver/limnoria:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
    ports:
      - '8080:8080/tcp'
    volumes:
      - '/srv/lsio/limnoria/config:/config'
    restart: 'unless-stopped'
    platform: 'linux'
