services:
  blade-of-agony:
    image: linuxserver/blade-of-agony:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
    ports:
      - '3000:3000/tcp'
      - '3001:3001/tcp'
    volumes:
      - '/srv/lsio/blade-of-agony/config:/config'
    restart: 'unless-stopped'
    platform: 'linux'
