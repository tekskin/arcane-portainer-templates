services:
  socket-proxy:
    image: linuxserver/socket-proxy:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
    ports:
      - '80:80/tcp'
    volumes:
      - '/srv/lsio/socket-proxy/config:/config'
    restart: 'unless-stopped'
    platform: 'linux'
