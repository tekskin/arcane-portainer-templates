services:
  vlc:
    image: linuxserver/vlc:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
      VLC_CLI: '${VLC_CLI:---no-qt-minimal-view}'
    ports:
      - '3000:3000/tcp'
      - '3001:3001/tcp'
    volumes:
      - '/srv/lsio/vlc/config:/config'
    restart: 'unless-stopped'
    platform: 'linux'
