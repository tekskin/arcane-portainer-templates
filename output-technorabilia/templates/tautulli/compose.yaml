services:
  tautulli:
    image: linuxserver/tautulli:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
    ports:
      - '8181:8181/tcp'
    volumes:
      - '/srv/lsio/tautulli/config:/config'
    restart: 'unless-stopped'
    platform: 'linux'
