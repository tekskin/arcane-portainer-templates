services:
  boinc:
    image: linuxserver/boinc:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
      PASSWORD: '${PASSWORD:-}'
    ports:
      - '8080:8080/tcp'
      - '8181:8181/tcp'
    volumes:
      - '/srv/lsio/boinc/config:/config'
    restart: 'unless-stopped'
    platform: 'linux'
