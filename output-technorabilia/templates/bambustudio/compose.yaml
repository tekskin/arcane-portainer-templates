services:
  bambustudio:
    image: linuxserver/bambustudio:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
      DARK_MODE: '${DARK_MODE:-true}'
    ports:
      - '3000:3000/tcp'
      - '3001:3001/tcp'
    volumes:
      - '/srv/lsio/bambustudio/config:/config'
    restart: 'unless-stopped'
    platform: 'linux'
