services:
  mame:
    image: linuxserver/mame:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
    ports:
      - '3000:3000/tcp'
      - '3001:3001/tcp'
    volumes:
      - '/srv/lsio/mame/config:/config'
      - '/srv/lsio/mame/mame:ro:/mame:ro'
    restart: 'unless-stopped'
    platform: 'linux'
