services:
  luanti:
    image: linuxserver/luanti:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
      CLI_ARGS: '${CLI_ARGS:---gameid devtest}'
    ports:
      - '30000:30000/udp'
    volumes:
      - '/srv/lsio/luanti/config/.minetest:/config/.minetest'
    restart: 'unless-stopped'
    platform: 'linux'
