services:
  homeassistant:
    image: linuxserver/homeassistant:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
    ports:
      - '8123:8123/tcp'
    volumes:
      - '/srv/lsio/homeassistant/config:/config'
    restart: 'unless-stopped'
    platform: 'linux'
