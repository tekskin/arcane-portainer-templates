services:
  modmanager:
    image: linuxserver/modmanager:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
    ports:
      - '80:80/tcp'
    volumes:
      - '/srv/lsio/modmanager/config:/config'
    restart: 'unless-stopped'
    platform: 'linux'
