services:
  bitcoin-knots:
    image: linuxserver/bitcoin-knots:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-Etc/UTC}'
    ports:
      - '3000:3000/tcp'
      - '3001:3001/tcp'
      - '8333:8333/tcp'
    volumes:
      - '/srv/lsio/bitcoin-knots/config:/config'
    restart: 'unless-stopped'
    platform: 'linux'
