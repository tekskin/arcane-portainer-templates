services:
  jackett:
    image: linuxserver/jackett:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-100}'
    ports:
      - '9117:9117/tcp'
    volumes:
      - '${PORTAINER_ROOT}/Files/AppData/Config/Jackett:/config'
      - '${PORTAINER_ROOT}/Downloads:/downloads'
    restart: 'unless-stopped'
    platform: 'linux'
