services:
  adguard:
    image: adguard/adguardhome:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-100}'
      CONTEXT_PATH: '${CONTEXT_PATH:-adguard home}'
    ports:
      - '53:53/tcp'
      - '53:53/udp'
      - '67:67/udp'
      - '68:68/tcp'
      - '68:68/udp'
      - '80:80/tcp'
      - '443:443/tcp'
      - '853:853/tcp'
      - '3000:3000/tcp'
    volumes:
      - '${PORTAINER_ROOT}/Files/AppData/Adguard/Workdir:/opt/adguardhome/work'
      - '${PORTAINER_ROOT}/Files/AppData/Adguard/Conf:/opt/adguardhome/conf'
    restart: 'unless-stopped'
    platform: 'linux'
