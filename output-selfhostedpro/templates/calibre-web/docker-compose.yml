services:
  calibre-web:
    image: linuxserver/calibre-web:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-100}'
    ports:
      - '8083:8083/tcp'
    volumes:
      - '${PORTAINER_ROOT}/Books:/books'
      - '${PORTAINER_ROOT}/Files/AppData/Config/Calibre-web:/config'
    restart: 'unless-stopped'
    platform: 'linux'
