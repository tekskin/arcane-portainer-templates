services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-100}'
      VERSION: '${VERSION:-latest}'
    volumes:
      - '${PORTAINER_ROOT}/Files/AppData/Config/Plex:/config'
      - '${PORTAINER_ROOT}/TV:/tv'
      - '${PORTAINER_ROOT}/Movies:/movies'
    restart: 'unless-stopped'
    platform: 'linux'
