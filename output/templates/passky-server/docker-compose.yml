services:
  passky-server:
    image: rabbitcompany/passky-server:latest
    environment:
      ADMIN_USERNAME: '${ADMIN_USERNAME:-admin}'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-}'
    ports:
      - '8080:80/tcp'
    volumes:
      - '${PORTAINER_ROOT}/Files/AppData/Passky-Server:/var/www/html/databases'
    restart: 'unless-stopped'
    platform: 'linux'
