services:
  pihole:
    image: pihole/pihole:latest
    ports:
      - '53:53/tcp'
      - '53:53/udp'
      - '67:67/udp'
      - '1010:80/tcp'
      - '4443:443/tcp'
    volumes:
      - '${PORTAINER_ROOT}/Files/AppData/Config/PiHole:/etc/pihole'
      - '${PORTAINER_ROOT}/Files/AppData/Config/PiHole/DNS:/etc/dnsmasq.d'
    restart: 'unless-stopped'
    platform: 'linux'
